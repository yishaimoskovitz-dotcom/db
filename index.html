<!DOCTYPE html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyst Data Hub</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #0f172a; direction: rtl; margin: 0; }
      .bg-gradient-fixed {
        background: radial-gradient(circle at 10% 20%, rgb(241, 245, 249) 0%, rgb(255, 255, 255) 90%);
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      }
      .solid-input {
        display: block; width: 100%; background-color: #ffffff;
        border: 2px solid #000000 !important; border-radius: 8px;
        padding: 12px 16px; font-size: 14px; color: #000000;
        outline: none; transition: all 0.2s; margin-top: 6px; box-sizing: border-box;
      }
      .solid-input:focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
      .field-label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; }
      .form-group { margin-bottom: 20px; width: 100%; }

      /* תיקון קריטי לגלילה במודל */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px); z-index: 1000;
        display: flex; align-items: center; justify-content: center;
        padding: 20px; overflow-y: auto; /* מאפשר גלילה של כל ה-Overlay אם צריך */
      }
      .modal-content {
        background: white; border-radius: 24px; width: 100%; max-width: 600px;
        max-height: 90vh; /* תופס מקסימום 90% מהגובה של המסך */
        display: flex; flex-col: column; overflow: hidden; /* התוכן הפנימי נשלט */
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: fadeIn 0.2s ease-out;
      }
      .modal-body { overflow-y: auto; padding: 32px; flex-grow: 1; }
      
      .fade-in { animation: fadeIn 0.2s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; z-index: 3000; display: flex; align-items: center; gap: 10px; }
    </style>
  </head>
  <body>
    <div class="bg-gradient-fixed"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const SHEET_ID = '1myMr9MeMtgAcipoR1rJaX3MdamlIBZugt_TX5eafX7Q';
      const GOOGLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp0lqIcCdgBEbeaCf1mfGax3hTlhDVP5BG-aF6LnkHVugCkjnytj1ih4IQJYYTFl-s/exec"; 
      const MANAGER_EMAIL = "yishaimoskovitz@gmail.com";

      const COLUMNS = [
        { idx: 0, label: 'נושא', type: 'select', required: true },
        { idx: 1, label: 'תת נושא', type: 'text', required: true },
        { idx: 2, label: 'אחראי', type: 'select' },
        { idx: 3, label: 'אימייל אחראי', type: 'select' }, 
        { idx: 4, label: 'תיאור מקור', type: 'textarea' },
        { idx: 5, label: 'שם המקור', type: 'select' },
        { idx: 6, label: 'טבלה מטויבת', type: 'text' },
        { idx: 7, label: 'מקור (קישור)', type: 'text' },
        { idx: 8, label: 'שם לקוח', type: 'text' },
        { idx: 9, label: 'איש קשר ממקור הנתונים', type: 'text' },
        { idx: 10, label: 'אופן העברה', type: 'select' },
        { idx: 11, label: 'רגישות נתונים', type: 'select' },
        { idx: 12, label: 'תדירות העברה', type: 'select' },
        { idx: 13, label: 'סוג המקור', type: 'select' },
        { idx: 14, label: 'איכות המקור', type: 'select' },
        { idx: 15, label: 'עדכון אחרון', type: 'date', auto: true }
      ];

      const parseCSV = (str) => {
        const arr = [];
        let quote = false, col = 0, row = 0, c = 0;
        for (; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || [];
          arr[row][col] = arr[row][col] || '';
          if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
          if (cc == '"') { quote = !quote; continue; }
          if (cc == ',' && !quote) { ++col; continue; }
          if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc == '\n' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
        }
        return arr;
      };

      const Icon = ({ name, size = 16, className = "" }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (window.lucide && ref.current) {
            ref.current.innerHTML = '';
            const i = document.createElement('i');
            i.setAttribute('data-lucide', name);
            i.style.width = `${size}px`; i.style.height = `${size}px`; i.className = className;
            ref.current.appendChild(i);
            try { window.lucide.createIcons({ root: ref.current, icons: { [name]: window.lucide.icons[name] } }); } catch(e) {}
          }
        }, [name, size, className]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width: size, height: size}}></span>;
      };

      const Linkify = ({ content }) => {
        if (typeof content !== 'string') return content;
        const parts = content.split(/((?:https?:\/\/|www\.)[^\s]+)/g);
        return <>{parts.map((p, i) => p.match(/^(https?:\/\/|www\.)/) ? <a key={i} href={p.startsWith('www') ? `https://${p}` : p} target="_blank" className="text-indigo-600 hover:underline font-medium break-all" onClick={e=>e.stopPropagation()}>{p}</a> : p)}</>;
      };

      // --- קומפוננטת הטופס ---
      const DynamicForm = ({ title, formData, setFormData, onSubmit, onClose, submitText, isSubmitting, fullData }) => {
         const [otherMode, setOtherMode] = useState({});
         const handleChange = (idx, value) => {
            const newValues = [...formData];
            newValues[idx] = value;
            setFormData(newValues);
         }
         const getOptions = (colIdx) => {
            return [...new Set(fullData.map(item => item.values[colIdx]).filter(v => v && v.trim() !== ""))].sort();
         }

         return (
            <div className="modal-content" onClick={e=>e.stopPropagation()}>
               <div className="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                  <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="X" size={20}/></button>
                  <h2 className="font-bold text-xl">{title}</h2>
               </div>
               <div className="modal-body text-right">
                  <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
                     {COLUMNS.map((col) => {
                        if (col.auto) return null;
                        const opts = getOptions(col.idx);
                        const isSelect = col.type === 'select' || (opts.length > 0 && col.idx !== 1);
                        return (
                           <div key={col.idx} className="form-group">
                              <label className="field-label">{col.label}</label>
                              {col.type === 'textarea' ? (
                                 <textarea className="solid-input min-h-[100px]" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} />
                              ) : isSelect && !otherMode[col.idx] ? (
                                 <div className="relative">
                                     <select className="solid-input appearance-none" value={formData[col.idx] || ''} 
                                       onChange={e => e.target.value === "NEW" ? (setOtherMode({...otherMode, [col.idx]: true}), handleChange(col.idx, "")) : handleChange(col.idx, e.target.value)} 
                                       required={col.required}>
                                        <option value="" disabled>בחר מהקיים...</option>
                                        {opts.map(o => <option key={o} value={o}>{o}</option>)}
                                        <option value="NEW" className="text-indigo-600 font-bold">+ אחר...</option>
                                     </select>
                                     <div className="absolute left-3 top-[23px] pointer-events-none text-slate-400"><Icon name="ChevronDown" size={16} /></div>
                                 </div>
                              ) : (
                                 <div className="relative">
                                    <input type={col.idx===3?'email':'text'} className="solid-input" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} required={col.required} />
                                    {otherMode[col.idx] && <button type="button" onClick={() => setOtherMode({...otherMode, [col.idx]: false})} className="absolute left-2 top-[21px] bg-slate-100 px-2 py-1 rounded text-[10px] border">חזור</button>}
                                 </div>
                              )}
                           </div>
                        )
                     })}
                     <button disabled={isSubmitting} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-4 shadow-lg hover:bg-slate-800 transition-all flex justify-center gap-2">
                        {isSubmitting ? <Icon name="Loader2" className="spin" /> : submitText}
                     </button>
                  </form>
               </div>
            </div>
         );
      }

      // --- מודל צפייה כולל הערות ---
      const ViewEditModal = ({ item, onClose, onRefresh, setToast, userEmail, fullData }) => {
         const [mode, setMode] = useState('view');
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [comment, setComment] = useState("");
         const [editData, setEditData] = useState([...item.values]); 
         const canEdit = userEmail === MANAGER_EMAIL || userEmail === item.values[3];

         // פענוח הערות מעמודה 17 (אינדקס 17 ב-newData)
         let commentsList = [];
         try { commentsList = item.comments ? JSON.parse(item.comments) : []; } catch (e) { commentsList = []; }

         const handleUpdate = async () => {
            setIsSubmitting(true);
            const newDataArray = [...editData];
            newDataArray[15] = new Date().toLocaleDateString('he-IL');
            try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', id: item.id, values: newDataArray }) }); setToast("עודכן בהצלחה!"); onRefresh(); onClose(); } catch(e) { setIsSubmitting(false); }
         }

         const handlePostComment = async () => {
            if (!comment.trim()) return;
            setIsSubmitting(true);
            try {
               await fetch(APPS_SCRIPT_URL, { 
                  method: 'POST', mode: 'no-cors', 
                  body: JSON.stringify({ action: 'addComment', id: item.id, userEmail, text: comment }) 
               });
               setToast("תגובה נוספה!"); onRefresh(); onClose();
            } catch(e) { setIsSubmitting(false); }
         }

         if (mode === 'edit') return <div className="modal-overlay" onClick={onClose}><DynamicForm title="עריכה" formData={editData} setFormData={setEditData} fullData={fullData} onSubmit={handleUpdate} isSubmitting={isSubmitting} onClose={onClose} submitText="שמור" /></div>;

         return (
            <div className="modal-overlay" onClick={onClose}>
               <div className="modal-content" onClick={e=>e.stopPropagation()}>
                  <div className="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                     <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icon name="X" size={24}/></button>
                     <h2 className="text-xl font-bold">{item.values[1]}</h2>
                  </div>
                  <div className="modal-body text-right">
                     <div className="space-y-4">
                        {COLUMNS.map((col) => {
                           const val = item.values[col.idx]; if (!val) return null;
                           return <div key={col.idx} className="bg-slate-50 p-4 rounded-xl border border-slate-100"><div className="text-xs font-bold text-slate-400 uppercase mb-1">{col.label}</div><div className="font-medium text-slate-900"><Linkify content={val} /></div></div>;
                        })}
                     </div>
                     
                     {canEdit && <button onClick={()=>setMode('edit')} className="w-full py-3 border-2 border-indigo-600 text-indigo-600 rounded-xl font-bold mt-6 hover:bg-indigo-50 transition-all flex items-center justify-center gap-2"><Icon name="Edit3" size={16}/> ערוך פרטים</button>}

                     <div className="mt-8 pt-6 border-t">
                        <h3 className="font-bold text-slate-500 mb-4 flex items-center gap-2"><Icon name="MessageSquare" size={18}/> הערות ({commentsList.length})</h3>
                        <div className="space-y-3 mb-4">
                           {commentsList.map((c, i) => (
                              <div key={i} className="bg-white p-3 rounded-lg border border-slate-200">
                                 <div className="text-[10px] text-slate-400 font-bold mb-1">{c.user.split('@')[0]}</div>
                                 <div className="text-sm text-slate-700">{c.text}</div>
                              </div>
                           ))}
                        </div>
                        <div className="flex gap-2 relative">
                           <input className="solid-input pr-4" placeholder="כתוב הערה..." value={comment} onChange={e=>setComment(e.target.value)} />
                           <button onClick={handlePostComment} className="absolute left-2 top-[10px] p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all"><Icon name="Send" size={14}/></button>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         );
      }

      function App() {
        const [data, setData] = useState([]);
        const [searchTerm, setSearchTerm] = useState("");
        const [selectedDomain, setSelectedDomain] = useState(null);
        const [isLoading, setIsLoading] = useState(true);
        const [selectedItem, setSelectedItem] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [toastMsg, setToastMsg] = useState(null);
        const [userEmail, setUserEmail] = useState("");

        useEffect(() => { const stored = localStorage.getItem('userEmail'); if (stored) setUserEmail(stored); fetchData(); }, []);
        
        const fetchData = async () => { 
          setIsLoading(true); 
          try { 
            const resp = await fetch(`https://corsproxy.io/?${encodeURIComponent(GOOGLE_CSV_URL + `&t=${Date.now()}`)}`); 
            const text = await resp.text(); 
            const rows = parseCSV(text); 
            if (rows.length < 2) { setData([]); return; } 
            const newData = rows.slice(1).map((row, index) => ({ 
               id: index, 
               values: row.slice(0, 16), 
               interestedUsers: row[16], 
               comments: row[17], // הערות מעמודה 17 בשיטס
               status: row[18] 
            })).filter(i => i.values[1]); 
            setData(newData); 
          } catch (err) {} finally { setIsLoading(false); } 
        };

        const filteredData = useMemo(() => data.filter(item => item.values.join(" ").toLowerCase().includes(searchTerm.toLowerCase()) && (selectedDomain ? item.values[0] === selectedDomain : true)), [data, searchTerm, selectedDomain]);
        const domains = [...new Set(data.map(i => i.values[0]))].filter(Boolean);

        if (!userEmail) return (
           <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center border border-slate-200">
                 <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg"><Icon name="Database" size={32} className="text-white" /></div>
                 <h1 className="text-2xl font-bold mb-6 text-slate-900">Analyst Data Hub</h1>
                 <form onSubmit={(e) => { e.preventDefault(); const em = e.target.email.value; if(em.includes('@')) { localStorage.setItem('userEmail', em); setUserEmail(em); } }}>
                    <div className="form-group text-right"><label className="field-label">מייל ארגוני</label><input name="email" type="email" className="solid-input" required autoFocus /></div>
                    <button className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all shadow-lg">כניסה</button>
                 </form>
              </div>
           </div>
        );

        return (
          <div className="min-h-screen pb-20 fade-in text-right">
             <header className="bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b p-4 flex justify-between items-center shadow-sm">
                <div className="flex gap-3">
                   <button onClick={() => setShowAddModal(true)} className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-slate-800 transition-all flex items-center gap-2"><Icon name="Plus" size={16}/> הוספת מקור</button>
                   <button onClick={fetchData} className="bg-white border-2 border-slate-100 px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-50 transition-all flex items-center gap-2"><Icon name="RefreshCw" className={isLoading?"spin":""} size={16}/> רענן נתונים</button>
                   <button onClick={() => { localStorage.removeItem('userEmail'); setUserEmail(""); }} className="bg-white border-2 border-slate-100 px-3 py-2.5 rounded-xl text-red-500 hover:bg-red-50 transition-all"><Icon name="LogOut" size={18}/></button>
                </div>
                <div className="font-bold text-xl flex items-center gap-2 cursor-pointer" onClick={()=>{setSelectedDomain(null); setSearchTerm("");}}>
                   <span>Analyst Data Hub</span>
                   <div className="bg-indigo-600 text-white p-2 rounded-xl"><Icon name="Database" size={20} /></div> 
                </div>
             </header>

             <div className="max-w-7xl mx-auto px-4 mt-8">
                <div className="mb-8 relative max-w-2xl mx-auto">
                  <input placeholder="חיפוש חופשי..." className="solid-input pr-12 h-14 text-lg" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
                  <Icon name="Search" className="absolute right-4 top-[24px] text-slate-400" size={20} />
                </div>
                
                <div className="flex flex-wrap gap-2 mb-10 justify-center">
                   {domains.map(d=><button key={d} onClick={() => setSelectedDomain(d)} className={`px-5 py-2 rounded-xl font-bold text-sm transition-all ${selectedDomain===d?'bg-slate-800 text-white shadow-md':'bg-white border-2 border-slate-50 text-slate-500 hover:bg-slate-50'}`}>{d}</button>)}
                   <button onClick={() => setSelectedDomain(null)} className={`px-5 py-2 rounded-xl font-bold text-sm ${!selectedDomain?'bg-slate-800 text-white':'bg-white border-2 border-slate-50 text-slate-500'}`}>הכל</button>
                </div>

                {isLoading && data.length === 0 ? <div className="text-center py-20 opacity-50">טוען...</div> : 
                  <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    {filteredData.map((item, idx) => (
                       <div key={idx} onClick={() => setSelectedItem(item)} className="bg-white rounded-2xl border-2 border-slate-50 p-6 shadow-sm hover:shadow-xl hover:border-indigo-100 transition-all cursor-pointer text-right flex flex-col relative overflow-hidden">
                          <div className="h-1 w-full bg-indigo-500 absolute top-0 left-0"></div>
                          <span className="text-[10px] font-bold text-indigo-400 uppercase mb-2">{item.values[0]}</span>
                          <h3 className="text-lg font-bold text-slate-900 leading-tight mb-4 flex-grow">{item.values[1]}</h3>
                          <div className="text-xs text-slate-400 border-t pt-3 flex items-center gap-1"><Icon name="User" size={12}/> {item.values[2] || "לא צוין"}</div>
                       </div>
                    ))}
                  </div>
                }
             </div>

             {selectedItem && <ViewEditModal item={selectedItem} onClose={()=>setSelectedItem(null)} onRefresh={fetchData} setToast={setToastMsg} userEmail={userEmail} fullData={data} />}
             
             {showAddModal && (
               <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
                  <DynamicForm title="הוספה" formData={Array(16).fill("")} setFormData={(vals) => {
                      const add = async () => {
                         try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'create', values: vals.map((v,i)=>i===15?new Date().toLocaleDateString('he-IL'):(i===3 && !v ? userEmail : v)) }) }); setToastMsg("נוסף!"); fetchData(); setShowAddModal(false); } catch(e) {}
                      }; add();
                    }} fullData={data} onSubmit={()=>{}} isSubmitting={false} onClose={()=>setShowAddModal(false)} submitText="שמור" />
               </div>
             )}
             {toastMsg && <div className="toast" onClick={()=>setToastMsg(null)}><Icon name="Check"/> {toastMsg}</div>}
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
