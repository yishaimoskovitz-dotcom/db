<!DOCTYPE html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyst Data Hub</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #0f172a; direction: rtl; margin: 0; }
      
      .bg-gradient-fixed {
        background: radial-gradient(circle at 10% 20%, rgb(241, 245, 249) 0%, rgb(255, 255, 255) 90%);
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      }

      /* עיצוב שדות קלט עם מסגרת שחורה קבועה */
      .solid-input {
        display: block; width: 100%; background-color: #ffffff;
        border: 2px solid #000000 !important; border-radius: 8px;
        padding: 12px 16px; font-size: 14px; color: #000000;
        outline: none; transition: all 0.2s; margin-top: 6px; box-sizing: border-box;
      }
      .solid-input:focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
      
      .field-label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; }
      .form-group { margin-bottom: 20px; width: 100%; }

      /* אנימציית פתיחה חלקה למודל */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px); z-index: 1000;
        display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      
      .fade-in { animation: fadeIn 0.2s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; z-index: 3000; display: flex; align-items: center; gap: 10px; }
    </style>
  </head>
  <body>
    <div class="bg-gradient-fixed"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // --- הגדרות מערכת ---
      const SHEET_ID = '1myMr9MeMtgAcipoR1rJaX3MdamlIBZugt_TX5eafX7Q';
      const GOOGLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp0lqIcCdgBEbeaCf1mfGax3hTlhDVP5BG-aF6LnkHVugCkjnytj1ih4IQJYYTFl-s/exec"; 
      const MANAGER_EMAIL = "yishaimoskovitz@gmail.com";

      const COLUMNS = [
        { idx: 0, label: 'נושא', type: 'select', required: true },
        { idx: 1, label: 'תת נושא', type: 'text', required: true },
        { idx: 2, label: 'אחראי', type: 'select' },
        { idx: 3, label: 'אימייל אחראי', type: 'select' }, 
        { idx: 4, label: 'תיאור מקור', type: 'textarea' },
        { idx: 5, label: 'שם המקור', type: 'select' },
        { idx: 6, label: 'טבלה מטויבת', type: 'text' },
        { idx: 7, label: 'מקור (קישור)', type: 'text' },
        { idx: 8, label: 'שם לקוח', type: 'text' },
        { idx: 9, label: 'איש קשר ממקור הנתונים', type: 'text' },
        { idx: 10, label: 'אופן העברה', type: 'select' },
        { idx: 11, label: 'רגישות נתונים', type: 'select' },
        { idx: 12, label: 'תדירות העברה', type: 'select' },
        { idx: 13, label: 'סוג המקור', type: 'select' },
        { idx: 14, label: 'איכות המקור', type: 'select' },
        { idx: 15, label: 'עדכון אחרון', type: 'date', auto: true }
      ];

      // --- פונקציות עזר ---
      const parseCSV = (str) => {
        const arr = [];
        let quote = false, col = 0, row = 0, c = 0;
        for (; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || [];
          arr[row][col] = arr[row][col] || '';
          if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
          if (cc == '"') { quote = !quote; continue; }
          if (cc == ',' && !quote) { ++col; continue; }
          if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc == '\n' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
        }
        return arr;
      };

      const Icon = ({ name, size = 16, className = "" }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (window.lucide && ref.current) {
            ref.current.innerHTML = '';
            const i = document.createElement('i');
            i.setAttribute('data-lucide', name);
            i.style.width = `${size}px`; i.style.height = `${size}px`; i.className = className;
            ref.current.appendChild(i);
            try { window.lucide.createIcons({ root: ref.current, icons: { [name]: window.lucide.icons[name] } }); } catch(e) {}
          }
        }, [name, size, className]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width: size, height: size}}></span>;
      };

      const Linkify = ({ content }) => {
        if (typeof content !== 'string') return content;
        const parts = content.split(/((?:https?:\/\/|www\.)[^\s]+)/g);
        return <>{parts.map((p, i) => p.match(/^(https?:\/\/|www\.)/) ? <a key={i} href={p.startsWith('www') ? `https://${p}` : p} target="_blank" className="text-indigo-600 hover:underline font-medium break-all" onClick={e=>e.stopPropagation()}>{p}</a> : p)}</>;
      };

      // --- רכיבי טופס ---
      const DynamicForm = ({ title, formData, setFormData, onSubmit, onClose, submitText, isSubmitting, fullData }) => {
         const [otherMode, setOtherMode] = useState({});

         const handleChange = (idx, value) => {
            const newValues = [...formData];
            newValues[idx] = value;
            setFormData(newValues);
         }

         const getOptionsFromData = (colIdx) => {
            return [...new Set(fullData.map(item => item.values[colIdx]).filter(v => v && v.trim() !== ""))].sort();
         }

         return (
            <div className="bg-white rounded-2xl w-full max-w-lg flex flex-col max-h-[85vh] shadow-2xl fade-in" onClick={e=>e.stopPropagation()}>
               <div className="p-5 border-b flex justify-between items-center bg-white sticky top-0 z-10 rounded-t-2xl">
                  <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icon name="X" size={20}/></button>
                  <h2 className="font-bold text-xl">{title}</h2>
               </div>
               <div className="p-6 overflow-y-auto text-right">
                  <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
                     {COLUMNS.map((col) => {
                        if (col.auto) return null;
                        const existingOpts = getOptionsFromData(col.idx);
                        const isSelectField = col.idx !== 1 && (col.type === 'select' || existingOpts.length > 0);

                        return (
                           <div key={col.idx} className="form-group">
                              <label className="field-label">{col.label}</label>
                              {col.type === 'textarea' ? (
                                 <textarea className="solid-input min-h-[80px]" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} />
                              ) : isSelectField && !otherMode[col.idx] ? (
                                 <div className="relative">
                                     <select className="solid-input appearance-none cursor-pointer" value={formData[col.idx] || ''} 
                                       onChange={e => e.target.value === "ADD_NEW" ? (setOtherMode({...otherMode, [col.idx]: true}), handleChange(col.idx, "")) : handleChange(col.idx, e.target.value)} 
                                       required={col.required}>
                                        <option value="" disabled>בחר מהקיים...</option>
                                        {existingOpts.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        <option value="ADD_NEW" className="text-indigo-600 font-bold italic">+ אחר (הקלדה חופשית)...</option>
                                     </select>
                                     <div className="absolute left-3 top-[23px] pointer-events-none text-slate-400"><Icon name="ChevronDown" size={16} /></div>
                                 </div>
                              ) : (
                                 <div className="relative">
                                    <input type={col.idx===3?'email':'text'} className="solid-input" placeholder={otherMode[col.idx] ? "הקלד ערך חדש..." : ""} value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} required={col.required} />
                                    {otherMode[col.idx] && <button type="button" onClick={() => setOtherMode({...otherMode, [col.idx]: false})} className="absolute left-2 top-[21px] bg-slate-100 text-slate-500 px-2 py-1 rounded text-[10px] border">חזור</button>}
                                 </div>
                              )}
                           </div>
                        )
                     })}
                     <button disabled={isSubmitting} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-4 flex justify-center gap-2 hover:bg-slate-800 transition-colors shadow-lg">
                        {isSubmitting ? <Icon name="Loader2" className="spin" /> : submitText}
                     </button>
                  </form>
               </div>
            </div>
         );
      }

      // --- מודל צפייה ועריכה ---
      const ViewEditModal = ({ item, onClose, onRefresh, setToast, userEmail, fullData }) => {
         const [mode, setMode] = useState('view');
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [editData, setEditData] = useState([...item.values]); 
         
         // לוגיקת הרשאות עריכה: בעלים או מייל תואם
         const canEdit = userEmail === MANAGER_EMAIL || userEmail === item.values[3];

         useEffect(() => {
            document.body.style.overflow = 'hidden';
            return () => { document.body.style.overflow = 'unset'; };
         }, []);

         const handleUpdate = async () => {
            setIsSubmitting(true);
            const newDataArray = [...editData];
            newDataArray[15] = new Date().toLocaleDateString('he-IL');
            try { 
               await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', id: item.id, values: newDataArray }) }); 
               setToast("עודכן בהצלחה!"); 
               onRefresh(); 
               onClose(); 
            } catch(e) { 
               setIsSubmitting(false); 
            }
         }

         if (mode === 'edit') return <div className="modal-overlay" onClick={onClose}><DynamicForm title="עריכת פרטים" formData={editData} setFormData={setEditData} fullData={fullData} onSubmit={handleUpdate} isSubmitting={isSubmitting} onClose={onClose} submitText="שמור שינויים" /></div>;

         return (
            <div className="modal-overlay" onClick={onClose}>
               <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-y-auto flex flex-col fade-in text-right" onClick={e=>e.stopPropagation()}>
                  <div className="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10 rounded-t-2xl">
                     <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icon name="X" size={24}/></button>
                     <h2 className="text-xl font-bold">{item.values[1]}</h2>
                  </div>
                  <div className="p-8 space-y-4">
                     {COLUMNS.map((col) => {
                        const val = item.values[col.idx]; if (!val) return null;
                        return <div key={col.idx} className="bg-slate-50 p-4 rounded-xl border border-slate-100"><div className="text-xs font-bold text-slate-400 uppercase mb-1">{col.label}</div><div className="font-medium text-slate-900"><Linkify content={val} /></div></div>;
                     })}
                     {canEdit && (
                        <button onClick={()=>setMode('edit')} className="w-full py-4 border-2 border-indigo-600 text-indigo-600 rounded-xl font-bold hover:bg-indigo-50 transition-all mt-4 flex items-center justify-center gap-2">
                           <Icon name="Edit3" size={18} /> ערוך מידע זה
                        </button>
                     )}
                  </div>
               </div>
            </div>
         );
      }

      // --- אפליקציה ראשית ---
      function App() {
        const [data, setData] = useState([]);
        const [searchTerm, setSearchTerm] = useState("");
        const [selectedDomain, setSelectedDomain] = useState(null);
        const [isLoading, setIsLoading] = useState(true);
        const [selectedItem, setSelectedItem] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [toastMsg, setToastMsg] = useState(null);
        const [userEmail, setUserEmail] = useState("");

        useEffect(() => { 
           const storedEmail = localStorage.getItem('userEmail'); 
           if (storedEmail) setUserEmail(storedEmail); 
           fetchData(); 
        }, []);
        
        const fetchData = async () => { 
          setIsLoading(true); 
          try { 
            const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(GOOGLE_CSV_URL + `&t=${Date.now()}`)}`); 
            const text = await response.text(); 
            const rows = parseCSV(text); 
            if (rows.length < 2) { setData([]); return; } 
            const newData = rows.slice(1).map((row, index) => ({ id: index, values: row.slice(0, 16) })).filter(i => i.values[1]); 
            setData(newData); 
          } catch (err) {} finally { setIsLoading(false); } 
        };

        const filteredData = useMemo(() => data.filter(item => item.values.join(" ").toLowerCase().includes(searchTerm.toLowerCase()) && (selectedDomain ? item.values[0] === selectedDomain : true)), [data, searchTerm, selectedDomain]);
        const domains = [...new Set(data.map(i => i.values[0]))].filter(Boolean);

        const handleLogin = (email) => { localStorage.setItem('userEmail', email); setUserEmail(email); };
        const handleLogout = () => { localStorage.removeItem('userEmail'); setUserEmail(""); };

        if (!userEmail) return (
           <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center border border-slate-200 fade-in">
                 <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg"><Icon name="Database" size={32} className="text-white" /></div>
                 <h1 className="text-2xl font-bold mb-6 text-slate-900 font-['Rubik']">Analyst Data Hub</h1>
                 <form onSubmit={(e) => { e.preventDefault(); if(e.target.email.value.includes('@')) handleLogin(e.target.email.value); }}>
                    <div className="form-group text-right"><label className="field-label">כתובת מייל ארגונית</label><input type="email" name="email" className="solid-input" required autoFocus /></div>
                    <button className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all shadow-lg">כניסה למערכת</button>
                 </form>
              </div>
           </div>
        );

        return (
          <div className="min-h-screen pb-20 fade-in text-right">
             <header className="bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b p-4 flex justify-between items-center shadow-sm">
                <div className="flex gap-2 items-center">
                   <button onClick={() => setShowAddModal(true)} className="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md hover:bg-slate-800 transition-all flex items-center gap-2">
                      <Icon name="Plus" size={16} /> הוספת מקור
                   </button>
                   <button onClick={fetchData} className="bg-white border-2 border-slate-200 px-3 py-2.5 rounded-xl hover:bg-slate-50 transition-all flex items-center gap-2" title="רענן נתונים">
                      <Icon name="RefreshCw" className={isLoading?"spin":""} size={18}/>
                   </button>
                   <button onClick={handleLogout} className="bg-red-50 text-red-600 px-3 py-2.5 rounded-xl hover:bg-red-100 transition-all border border-red-100">
                      <Icon name="LogOut" size={18} />
                   </button>
                </div>
                <div className="font-bold text-xl flex items-center gap-3 cursor-pointer" onClick={()=>{setSelectedDomain(null); setSearchTerm("");}}>
                   <span className="bg-clip-text text-transparent bg-gradient-to-l from-slate-900 to-slate-600">Analyst Data Hub</span>
                   <div className="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-200"><Icon name="Database" size={20} /></div> 
                </div>
             </header>

             <div className="max-w-7xl mx-auto px-4 mt-8">
                <div className="mb-8 relative max-w-2xl mx-auto">
                  <input placeholder="חיפוש חופשי בקטלוג..." className="solid-input pr-12 h-14 text-lg" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
                  <Icon name="Search" className="absolute right-4 top-[24px] text-slate-400" size={20} />
                </div>
                
                <div className="flex flex-wrap gap-2 mb-10 justify-center">
                   <button onClick={() => setSelectedDomain(null)} className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${!selectedDomain?'bg-slate-800 text-white shadow-lg scale-105':'bg-white border-2 border-slate-100 text-slate-500 hover:bg-slate-50'}`}>הכל</button>
                   {domains.map(d=><button key={d} onClick={() => setSelectedDomain(d)} className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${selectedDomain===d?'bg-slate-800 text-white shadow-lg scale-105':'bg-white border-2 border-slate-100 text-slate-500 hover:bg-slate-50'}`}>{d}</button>)}
                </div>

                {isLoading && data.length === 0 ? (
                   <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                      {[1,2,3,4,5,6,7,8].map(i => <div key={i} className="h-48 bg-white/50 rounded-2xl border border-slate-100 animate-pulse"></div>)}
                   </div>
                ) : (
                   <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                      {filteredData.map((item, idx) => (
                         <div key={idx} onClick={() => setSelectedItem(item)} className="fade-in group bg-white rounded-2xl border-2 border-slate-100 p-6 shadow-sm hover:shadow-xl hover:border-indigo-100 transition-all cursor-pointer text-right flex flex-col relative overflow-hidden">
                            <div className="h-1.5 w-full bg-slate-100 absolute top-0 left-0 group-hover:bg-indigo-500 transition-colors"></div>
                            <span className="text-[10px] font-bold text-indigo-400 uppercase mb-2 tracking-wider">{item.values[0]}</span>
                            <h3 className="text-lg font-bold text-slate-900 leading-tight flex-grow mb-6 group-hover:text-indigo-600 transition-colors">{item.values[1]}</h3>
                            <div className="flex items-center gap-2 pt-4 border-t border-slate-50 text-slate-500 text-sm">
                               <Icon name="User" size={14} />
                               <span className="truncate font-medium">{item.values[2] || "לא צוין"}</span>
                            </div>
                         </div>
                      ))}
                   </div>
                )}
             </div>

             {selectedItem && <ViewEditModal item={selectedItem} onClose={()=>setSelectedItem(null)} onRefresh={fetchData} setToast={(m)=>setToastMsg(m)} userEmail={userEmail} fullData={data} />}
             
             {showAddModal && (
               <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
                  <DynamicForm 
                    title="הוספת מקור חדש" 
                    formData={Array(16).fill("")} 
                    setFormData={(vals) => {
                      const submitNew = async () => {
                         try { 
                            const finalVals = vals.map((v,i) => {
                               if(i === 15) return new Date().toLocaleDateString('he-IL');
                               if(i === 3 && !v) return userEmail;
                               return v;
                            });
                            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'create', values: finalVals }) }); 
                            setToastMsg("נוסף בהצלחה!"); 
                            fetchData(); 
                            setShowAddModal(false); 
                         } catch(e) {}
                      };
                      submitNew();
                    }} 
                    fullData={data} 
                    onSubmit={()=>{}} 
                    isSubmitting={false} 
                    onClose={()=>setShowAddModal(false)} 
                    submitText="שמור למאגר" 
                  />
               </div>
             )}
             
             {toastMsg && <div className="toast fade-in" onClick={()=>setToastMsg(null)}><Icon name="Check" /> {toastMsg}</div>}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
