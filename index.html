<!DOCTYPE html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyst Data Hub</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #0f172a; direction: rtl; }
      
      .bg-gradient-fixed {
        background: radial-gradient(circle at 10% 20%, rgb(241, 245, 249) 0%, rgb(255, 255, 255) 90%);
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .fade-in { animation: fadeIn 0.2s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      .solid-input {
        display: block;
        width: 100%;
        background-color: #ffffff;
        border: 2px solid #000000 !important;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 14px;
        color: #000000;
        outline: none;
        transition: all 0.2s;
        margin-top: 6px;
        box-sizing: border-box;
      }

      .solid-input:focus {
        border-color: #4f46e5 !important;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }

      .solid-input::placeholder { color: #94a3b8; }
      .field-label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; }
      .form-group { margin-bottom: 20px; width: 100%; }
      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; z-index: 3000; animation: fadeIn 0.3s; }
    </style>
  </head>
  <body>
    <div class="bg-gradient-fixed"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const SHEET_ID = '1myMr9MeMtgAcipoR1rJaX3MdamlIBZugt_TX5eafX7Q';
      const GOOGLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp0lqIcCdgBEbeaCf1mfGax3hTlhDVP5BG-aF6LnkHVugCkjnytj1ih4IQJYYTFl-s/exec"; 
      const MANAGER_EMAIL = "yishaimoskovitz@gmail.com";

      // הוסרו כל רשימות ה-options הידניות (הדוגמאות)
      const COLUMNS = [
        { idx: 0, label: 'נושא', type: 'select', options: [], required: true },
        { idx: 1, label: 'תת נושא', type: 'text', required: true },
        { idx: 2, label: 'אחראי', type: 'select', options: [], smart: true },
        { idx: 3, label: 'אימייל אחראי', type: 'email' },
        { idx: 4, label: 'תיאור מקור', type: 'textarea' },
        { idx: 5, label: 'שם המקור', type: 'select', options: [], smart: true },
        { idx: 6, label: 'טבלה מטויבת', type: 'text' },
        { idx: 7, label: 'מקור (קישור)', type: 'text' },
        { idx: 8, label: 'שם לקוח', type: 'text' },
        { idx: 9, label: 'איש קשר ממקור הנתונים', type: 'text' },
        { idx: 10, label: 'אופן העברה', type: 'select', options: [] },
        { idx: 11, label: 'רגישות נתונים', type: 'select', options: [] },
        { idx: 12, label: 'תדירות העברה', type: 'select', options: [] },
        { idx: 13, label: 'סוג המקור', type: 'select', options: [] },
        { idx: 14, label: 'איכות המקור', type: 'select', options: [] },
        { idx: 15, label: 'עדכון אחרון', type: 'date', auto: true }
      ];

      const parseCSV = (str) => {
        const arr = [];
        let quote = false, col = 0, row = 0, c = 0;
        for (; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || [];
          arr[row][col] = arr[row][col] || '';
          if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
          if (cc == '"') { quote = !quote; continue; }
          if (cc == ',' && !quote) { ++col; continue; }
          if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc == '\n' && !quote) { ++row; col = 0; continue; }
          if (cc == '\r' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
        }
        return arr;
      };

      const Icon = ({ name, size = 16, className = "" }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (window.lucide && ref.current) {
            ref.current.innerHTML = '';
            const i = document.createElement('i');
            i.setAttribute('data-lucide', name);
            i.style.width = `${size}px`;
            i.style.height = `${size}px`;
            i.className = className;
            ref.current.appendChild(i);
            try { window.lucide.createIcons({ root: ref.current, icons: { [name]: window.lucide.icons[name] } }); } catch(e) {}
          }
        }, [name, size, className]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width: size, height: size}}></span>;
      };

      const Linkify = ({ content }) => {
        if (typeof content !== 'string') return content;
        const parts = content.split(/((?:https?:\/\/|www\.)[^\s]+)/g);
        return <>{parts.map((p, i) => p.match(/^(https?:\/\/|www\.)/) ? <a key={i} href={p.startsWith('www') ? `https://${p}` : p} target="_blank" className="text-indigo-600 hover:underline font-medium break-all" onClick={e=>e.stopPropagation()}>{p}</a> : p)}</>;
      };

      const Toast = ({ message, onClose }) => {
        useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
        return <div className="toast"><Icon name="CheckCircle" size={20} className="text-emerald-400" /><span>{message}</span></div>;
      };

      const getNotifications = (data, userEmail) => {
         const notifications = [];
         data.forEach(item => {
            const itemName = item.values[1] || item.values[0];
            const isMyItem = item.values[3] === userEmail;
            let followers = [];
            if (item.interestedUsers) followers = item.interestedUsers.split(",").filter(Boolean);
            if (isMyItem) {
               followers.forEach(f => { if (f !== userEmail) notifications.push({ type: 'follow', user: f, item: itemName }); });
               if (item.comments) {
                  try {
                     JSON.parse(item.comments).forEach(c => { if (c.user !== userEmail) notifications.push({ type: 'comment', user: c.user, item: itemName, text: c.text }); });
                  } catch(e) {}
               }
            }
         });
         return notifications;
      };

      const LoginPage = ({ onLogin, isChecking }) => {
         const [email, setEmail] = useState("");
         return (
            <div className="min-h-screen flex items-center justify-center p-4">
               <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center fade-in border border-slate-200">
                  <div className="bg-indigo-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg"><Icon name="Database" size={40} className="text-white" /></div>
                  <h1 className="text-3xl font-bold mb-2 text-slate-900">Analyst Data Hub</h1>
                  <p className="text-slate-500 mb-8">ברוכים הבאים למאגר המידע המרכזי.<br/>נא להזדהות כדי להמשיך.</p>
                  <form onSubmit={(e) => { e.preventDefault(); if(email.includes('@')) onLogin(email); }}>
                     <div className="form-group text-right">
                        <label className="field-label">כתובת מייל</label>
                        <input type="email" name="email" className="solid-input" value={email} onChange={e => setEmail(e.target.value)} required autoFocus />
                     </div>
                     <button disabled={isChecking} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold text-lg transition-all shadow-lg flex items-center justify-center gap-2 mt-4">{isChecking ? <Icon name="Loader2" className="spin" /> : "כניסה למערכת"}</button>
                  </form>
               </div>
            </div>
         );
      };

      const NotificationsModal = ({ onClose, notifications }) => (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm fade-in" onClick={onClose}>
          <div className="bg-white rounded-2xl w-full max-w-md flex flex-col max-h-[80vh] shadow-2xl" onClick={e=>e.stopPropagation()}>
            <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-2xl">
              <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2"><Icon name="Bell" size={20}/> ההתראות שלי</h2>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="X" size={20} className="text-slate-400"/></button>
            </div>
            <div className="p-4 overflow-y-auto bg-slate-50 flex-1">
              {notifications.length === 0 ? <div className="text-center py-10 opacity-50 flex flex-col items-center gap-2"><Icon name="Inbox" size={40}/><p className="text-slate-400 text-sm">אין התראות</p></div> : 
              <div className="space-y-3">
                {notifications.map((n, i) => (
                  <div key={i} className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm flex gap-3 items-start text-right">
                    <div className="p-2 rounded-full bg-indigo-50 text-indigo-600"><Icon name="Bell" size={16} /></div>
                    <div><p className="text-sm text-slate-800 leading-snug"><span className="font-bold">{n.user.split('@')[0]}</span> {n.type==='follow'?'עוקב אחרי':'הגיב על'} <span className="font-bold text-indigo-600">{n.item}</span></p></div>
                  </div>
                ))}
              </div>}
            </div>
          </div>
        </div>
      );

      const Card = ({ item, onClick, index, userEmail }) => {
        const domain = item.values[0] || "כללי";
        const isRequest = domain === "בקשת מידע";
        const followersList = item.interestedUsers ? item.interestedUsers.split(",").filter(Boolean) : [];
        const isFollowing = followersList.includes(userEmail);

        return (
          <div onClick={onClick} style={{ animationDelay: `${index * 50}ms` }} 
               className={`group fade-in rounded-2xl border shadow-sm hover:shadow-lg transition-all duration-300 cursor-pointer flex flex-col h-full overflow-hidden relative ${isRequest?'border-orange-200 bg-orange-50/20':'border-slate-200 bg-white'}`}>
            <div className={`h-1.5 w-full ${isRequest?'bg-orange-500':'bg-indigo-500'}`}></div>
            <div className="p-6 flex flex-col h-full text-right">
              <div className="flex justify-between items-start mb-4">
                <span className={`text-[11px] font-bold px-3 py-1 rounded-full border tracking-wide uppercase ${isRequest?'bg-orange-100 text-orange-700':'bg-slate-100 text-slate-600'}`}>{domain}</span>
              </div>
              <h3 className="text-lg font-bold text-slate-900 leading-snug mb-3">{item.values[1]}</h3>
              <div className="mt-auto pt-5 border-t border-slate-200/50 flex items-center justify-between text-slate-500 text-sm">
                 <div className="flex items-center gap-2"><div className="p-2 bg-slate-100 rounded-full"><Icon name="User" size={14} /></div><span className="truncate max-w-[140px] font-medium">{item.values[2]}</span></div>
                 {isRequest && isFollowing && <div className="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold">במעקב</div>}
              </div>
            </div>
          </div>
        );
      };

      const DynamicForm = ({ title, formData, setFormData, onSubmit, onClose, submitText, isSubmitting, fullData }) => {
         const [otherMode, setOtherMode] = useState({});

         const handleChange = (idx, value) => {
            const newValues = [...formData];
            newValues[idx] = value;
            setFormData(newValues);
         }

         // פונקציה שמביאה רק את הערכים שקיימים בשיטס עבור העמודה הזו
         const getExistingOptions = (colIdx) => {
            return [...new Set(fullData.map(item => item.values[colIdx]).filter(v => v && v.trim() !== "" && v !== "בקשת מידע"))].sort();
         }

         return (
            <div className="bg-white rounded-2xl w-full max-w-lg flex flex-col max-h-[90vh] fade-in shadow-2xl" onClick={e=>e.stopPropagation()}>
               <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-2xl sticky top-0 z-10 text-right">
                  <h2 className="font-bold text-xl text-slate-900">{title}</h2>
                  <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="X" size={20}/></button>
               </div>
               <div className="p-6 overflow-y-auto custom-scrollbar bg-white text-right">
                  <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
                     {COLUMNS.map((col) => {
                        if (col.auto) return null;
                        const existingOpts = getExistingOptions(col.idx);
                        const isSelect = col.type === 'select' || col.smart;

                        return (
                           <div key={col.idx} className="form-group">
                              <label className="field-label">{col.label}</label>
                              
                              {col.type === 'textarea' ? (
                                 <textarea className="solid-input min-h-[80px]" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} />
                              ) : isSelect && !otherMode[col.idx] ? (
                                 <div className="relative">
                                     <select className="solid-input appearance-none" value={formData[col.idx] || ''} 
                                       onChange={e => {
                                          if(e.target.value === "OTHER_VAL") {
                                             setOtherMode({...otherMode, [col.idx]: true});
                                             handleChange(col.idx, "");
                                          } else {
                                             handleChange(col.idx, e.target.value);
                                          }
                                       }} 
                                       required={col.required}
                                     >
                                        <option value="" disabled>בחר מהרשימה...</option>
                                        {existingOpts.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        <option value="OTHER_VAL" className="text-indigo-600 font-bold italic">+ אחר (הוספה ידנית)...</option>
                                     </select>
                                     <div className="absolute left-3 top-[38px] pointer-events-none text-slate-400"><Icon name="ChevronDown" size={16} /></div>
                                 </div>
                              ) : (
                                 <div className="relative">
                                    <input type={col.type==='email'?'email':'text'} className="solid-input" placeholder={otherMode[col.idx] ? "הקלד ערך חדש..." : ""} value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} required={col.required} />
                                    {otherMode[col.idx] && (
                                       <button type="button" onClick={() => setOtherMode({...otherMode, [col.idx]: false})} className="absolute left-2 top-[36px] bg-slate-100 text-slate-500 px-2 py-1 rounded text-[10px] border">חזור לבחירה</button>
                                    )}
                                 </div>
                              )}
                           </div>
                        )
                     })}
                     <button disabled={isSubmitting} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-4 flex justify-center gap-2">
                        {isSubmitting ? <Icon name="Loader2" className="spin" /> : "שמור נתונים"}
                     </button>
                  </form>
               </div>
            </div>
         );
      }

      const ViewEditModal = ({ item, onClose, onRefresh, setToast, userEmail, fullData }) => {
         const [mode, setMode] = useState('view');
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [comment, setComment] = useState("");
         const [editData, setEditData] = useState([...item.values]); 
         const isRequest = item.values[0] === "בקשת מידע";
         const canEdit = userEmail === MANAGER_EMAIL || userEmail === item.values[3];

         const handleUpdate = async (isConvert = false) => {
            setIsSubmitting(true);
            const newDataArray = [...editData];
            newDataArray[15] = new Date().toLocaleDateString('he-IL');
            if(isConvert) { newDataArray[0] = ""; newDataArray[3] = userEmail; }
            try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', id: item.id, values: newDataArray, status: isConvert ? 'Closed' : item.status }) }); setToast("עודכן!"); onRefresh(); onClose(); } catch(e) { setIsSubmitting(false); }
         }

         if (mode === 'edit') return <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 fade-in" onClick={onClose}><DynamicForm title="עריכה" formData={editData} setFormData={setEditData} fullData={fullData} onSubmit={()=>handleUpdate(isRequest)} isSubmitting={isSubmitting} onClose={onClose} submitText="שמור שינויים" /></div>;

         return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in text-right" onClick={onClose}>
               <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col" onClick={e=>e.stopPropagation()}>
                  <div className={`p-6 border-b flex justify-between items-start sticky top-0 bg-white z-10 ${isRequest?'bg-orange-50':''}`}>
                     <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition"><Icon name="X" size={24}/></button>
                     <div><span className="text-xs font-bold px-2 py-1 rounded bg-slate-100 border">{item.values[0]}</span><h2 className="text-2xl font-bold text-slate-900 mt-2">{item.values[1]}</h2></div>
                  </div>
                  <div className="p-8 space-y-6">
                     <div className="grid grid-cols-1 gap-4">
                        {COLUMNS.map((col) => {
                           const val = item.values[col.idx];
                           if (!val) return null;
                           return <div key={col.idx} className="bg-slate-50 p-4 rounded-xl border"><div className="text-xs font-bold text-slate-400 uppercase mb-1">{col.label}</div><div className="font-medium text-slate-900"><Linkify content={val} /></div></div>;
                        })}
                     </div>
                     {canEdit && <button onClick={()=>setMode('edit')} className="w-full py-3 border-2 border-indigo-600 text-indigo-600 rounded-xl font-bold hover:bg-indigo-50 transition">ערוך פרטים</button>}
                  </div>
               </div>
            </div>
         );
      }

      function App() {
        const [data, setData] = useState([]);
        const [searchTerm, setSearchTerm] = useState("");
        const [selectedDomain, setSelectedDomain] = useState(null);
        const [isLoading, setIsLoading] = useState(true);
        const [selectedItem, setSelectedItem] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [showNotifications, setShowNotifications] = useState(false);
        const [toastMsg, setToastMsg] = useState(null);
        const [userEmail, setUserEmail] = useState("");

        useEffect(() => { const storedEmail = localStorage.getItem('userEmail'); if (storedEmail) setUserEmail(storedEmail); }, []);
        const fetchData = async () => { setIsLoading(true); try { const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(GOOGLE_CSV_URL + `&t=${Date.now()}`)}`); const text = await response.text(); const rows = parseCSV(text); if (rows.length < 2) { setData([]); return; } const newData = rows.slice(1).map((row, index) => ({ id: index, values: row.slice(0, 16), interestedUsers: row[16], comments: row[17], status: row[18] })).filter(i => i.values[1]); setData(newData); } catch (err) {} finally { setIsLoading(false); } };
        useEffect(() => { fetchData(); }, []);

        const filteredData = useMemo(() => data.filter(item => { const term = searchTerm.toLowerCase(); return item.values.join(" ").toLowerCase().includes(term) && (selectedDomain ? item.values[0] === selectedDomain : true); }), [data, searchTerm, selectedDomain]);
        const domains = [...new Set(data.map(i => i.values[0]).filter(d => d && d !== "בקשת מידע"))].filter(Boolean);
        const notifications = useMemo(() => getNotifications(data, userEmail), [data, userEmail]);

        if (!userEmail) return <LoginPage onLogin={(email) => { localStorage.setItem('userEmail', email); setUserEmail(email); }} />;

        return (
          <div className="min-h-screen pb-20 fade-in text-right">
             <header className="bg-white/80 backdrop-blur-xl sticky top-0 z-30 border-b p-4 flex justify-between items-center gap-4">
                <div className="flex gap-2 items-center">
                   <button onClick={() => setShowAddModal(true)} className="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-lg">הוספת מקור</button>
                   <button onClick={fetchData} className="bg-white border px-3 py-2 rounded-xl"><Icon name="RefreshCw" className={isLoading?"spin":""}/></button>
                   <button onClick={() => setShowNotifications(true)} className="bg-white border px-3 py-2 rounded-xl relative"><Icon name="Bell" size={18} />{notifications.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}</button>
                </div>
                <div className="font-bold text-xl flex items-center gap-2 cursor-pointer" onClick={()=>{setSelectedDomain(null);}}>
                   <span>Analyst Data Hub</span>
                   <div className="bg-indigo-600 text-white p-2 rounded-xl"><Icon name="Database" size={20} /></div> 
                </div>
             </header>

             <div className="max-w-7xl mx-auto px-4 mt-8">
                <div className="mb-8 relative"><input placeholder="חיפוש חופשי..." className="solid-input pr-12" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} /><Icon name="Search" className="absolute right-4 top-[18px] text-slate-400" /></div>
                <div className="flex flex-wrap gap-2 mb-8 justify-end">
                   {domains.map(d=><button key={d} onClick={() => setSelectedDomain(d)} className={`px-4 py-2 rounded-xl font-bold text-sm ${selectedDomain===d?'bg-slate-800 text-white scale-105':'bg-white border text-slate-600'}`}>{d}</button>)}
                   <button onClick={() => setSelectedDomain("בקשת מידע")} className={`px-4 py-2 rounded-xl font-bold text-sm ${selectedDomain==="בקשת מידע"?'bg-orange-500 text-white':'bg-white border text-orange-600 border-orange-200'}`}>בקשות</button>
                   <button onClick={() => setSelectedDomain(null)} className={`px-4 py-2 rounded-xl font-bold text-sm ${!selectedDomain?'bg-slate-800 text-white':'bg-white border text-slate-600'}`}>הכל</button>
                </div>

                {isLoading ? <div className="text-center py-20 opacity-50">טוען...</div> : 
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">{filteredData.map((item, idx) => (<Card key={idx} item={item} index={idx} onClick={() => setSelectedItem(item)} userEmail={userEmail} />))}</div>
                }
             </div>

             {selectedItem && <ViewEditModal item={selectedItem} onClose={()=>setSelectedItem(null)} onRefresh={fetchData} setToast={setToastMsg} userEmail={userEmail} fullData={data} />}
             {showAddModal && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in" onClick={()=>setShowAddModal(false)}><DynamicForm title="הוספת מקור נתונים" formData={Array(16).fill("")} setFormData={()=>{}} fullData={data} onSubmit={async()=>{}} isSubmitting={false} onClose={()=>setShowAddModal(false)} submitText="שמור" /></div>}
             {showNotifications && <NotificationsModal onClose={()=>setShowNotifications(false)} notifications={notifications} />}
             {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)} />}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<React.StrictMode><App /></React.StrictMode>);
    </script>
  </body>
</html>
