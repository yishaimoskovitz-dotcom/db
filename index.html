<!DOCTYPE html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyst Data Hub</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      /* עיצוב כללי של הדף */
      body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #0f172a; direction: rtl; }
      
      /* רקע מדורג מקובע */
      .bg-gradient-fixed {
        background: radial-gradient(circle at 10% 20%, rgb(241, 245, 249) 0%, rgb(255, 255, 255) 90%);
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      }

      /* עיצוב גלילה (Scrollbar) */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* אנימציות כניסה וטעינה */
      .fade-in { animation: fadeIn 0.2s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

      /* עיצוב שדות קלט עם מסגרת שחורה בולטת */
      .solid-input {
        display: block; width: 100%; background-color: #ffffff;
        border: 2px solid #000000 !important; border-radius: 8px;
        padding: 12px 16px; font-size: 14px; color: #000000;
        outline: none; transition: all 0.2s; margin-top: 6px; box-sizing: border-box;
      }
      .solid-input:focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
      
      .field-label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; }
      .form-group { margin-bottom: 20px; width: 100%; }
      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; z-index: 3000; display: flex; align-items: center; gap: 10px; animation: fadeIn 0.3s; }
    </style>
  </head>
  <body>
    <div class="bg-gradient-fixed"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // ==========================================
      // בלוק 1: הגדרות וקונפיגורציה
      // ==========================================
      const SHEET_ID = '1myMr9MeMtgAcipoR1rJaX3MdamlIBZugt_TX5eafX7Q';
      const GOOGLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp0lqIcCdgBEbeaCf1mfGax3hTlhDVP5BG-aF6LnkHVugCkjnytj1ih4IQJYYTFl-s/exec"; 
      const MANAGER_EMAIL = "yishaimoskovitz@gmail.com";

      // הגדרת עמודות - שימו לב: ה-options הושארו ריקים כדי להישאב מהשיטס
      const COLUMNS = [
        { idx: 0, label: 'נושא', type: 'select', options: [], required: true },
        { idx: 1, label: 'תת נושא', type: 'text', required: true },
        { idx: 2, label: 'אחראי', type: 'select', options: [], smart: true },
        { idx: 3, label: 'אימייל אחראי', type: 'email' },
        { idx: 4, label: 'תיאור מקור', type: 'textarea' },
        { idx: 5, label: 'שם המקור', type: 'select', options: [], smart: true },
        { idx: 6, label: 'טבלה מטויבת', type: 'text' },
        { idx: 7, label: 'מקור (קישור)', type: 'text' },
        { idx: 8, label: 'שם לקוח', type: 'text' },
        { idx: 9, label: 'איש קשר ממקור הנתונים', type: 'text' },
        { idx: 10, label: 'אופן העברה', type: 'select', options: [] },
        { idx: 11, label: 'רגישות נתונים', type: 'select', options: [] },
        { idx: 12, label: 'תדירות העברה', type: 'select', options: [] },
        { idx: 13, label: 'סוג המקור', type: 'select', options: [] },
        { idx: 14, label: 'איכות המקור', type: 'select', options: [] },
        { idx: 15, label: 'עדכון אחרון', type: 'date', auto: true }
      ];

      // ==========================================
      // בלוק 2: פונקציות עזר (CSV, Icons, Notifications)
      // ==========================================
      const parseCSV = (str) => {
        const arr = [];
        let quote = false, col = 0, row = 0, c = 0;
        for (; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || [];
          arr[row][col] = arr[row][col] || '';
          if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
          if (cc == '"') { quote = !quote; continue; }
          if (cc == ',' && !quote) { ++col; continue; }
          if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc == '\n' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
        }
        return arr;
      };

      const Icon = ({ name, size = 16, className = "" }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (window.lucide && ref.current) {
            ref.current.innerHTML = '';
            const i = document.createElement('i');
            i.setAttribute('data-lucide', name);
            i.style.width = `${size}px`; i.style.height = `${size}px`; i.className = className;
            ref.current.appendChild(i);
            try { window.lucide.createIcons({ root: ref.current, icons: { [name]: window.lucide.icons[name] } }); } catch(e) {}
          }
        }, [name, size, className]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width: size, height: size}}></span>;
      };

      const Linkify = ({ content }) => {
        if (typeof content !== 'string') return content;
        const parts = content.split(/((?:https?:\/\/|www\.)[^\s]+)/g);
        return <>{parts.map((p, i) => p.match(/^(https?:\/\/|www\.)/) ? <a key={i} href={p.startsWith('www') ? `https://${p}` : p} target="_blank" className="text-indigo-600 hover:underline font-medium break-all" onClick={e=>e.stopPropagation()}>{p}</a> : p)}</>;
      };

      const getNotifications = (data, userEmail) => {
         const notifications = [];
         data.forEach(item => {
            const itemName = item.values[1] || item.values[0];
            const isMyItem = item.values[3] === userEmail;
            const followers = item.interestedUsers ? item.interestedUsers.split(",").filter(Boolean) : [];
            if (isMyItem) {
               followers.forEach(f => { if (f !== userEmail) notifications.push({ type: 'follow', user: f, item: itemName }); });
               try { JSON.parse(item.comments).forEach(c => { if (c.user !== userEmail) notifications.push({ type: 'comment', user: c.user, item: itemName, text: c.text }); }); } catch(e) {}
            }
            if (followers.includes(userEmail) && item.status === 'Closed') notifications.push({ type: 'status', user: 'המערכת', item: itemName, text: 'הבקשה הפכה למקור נתונים!' });
         });
         return notifications;
      };

      // ==========================================
      // בלוק 3: רכיבי UI קטנים (Toast, Login)
      // ==========================================
      const Toast = ({ message, onClose }) => {
        useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
        return <div className="toast"><Icon name="CheckCircle" size={20} className="text-emerald-400" /><span>{message}</span></div>;
      };

      const LoginPage = ({ onLogin, isChecking }) => {
         const [email, setEmail] = useState("");
         return (
            <div className="min-h-screen flex items-center justify-center p-4">
               <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md text-center fade-in border border-slate-200">
                  <div className="bg-indigo-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6"><Icon name="Database" size={40} className="text-white" /></div>
                  <h1 className="text-3xl font-bold mb-2 text-slate-900">Analyst Data Hub</h1>
                  <p className="text-slate-500 mb-8 text-sm">נא להזדהות עם המייל הארגוני</p>
                  <form onSubmit={(e) => { e.preventDefault(); if(email.includes('@')) onLogin(email); }}>
                     <div className="form-group text-right"><label className="field-label">כתובת מייל</label><input type="email" className="solid-input" value={email} onChange={e => setEmail(e.target.value)} required autoFocus /></div>
                     <button disabled={isChecking} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold transition-all shadow-lg flex items-center justify-center gap-2">{isChecking ? <Icon name="Loader2" className="spin" /> : "כניסה למערכת"}</button>
                  </form>
               </div>
            </div>
         );
      };

      // ==========================================
      // בלוק 4: הטופס הדינמי (הלב של המערכת)
      // ==========================================
      const DynamicForm = ({ title, formData, setFormData, onSubmit, onClose, submitText, isSubmitting, fullData }) => {
         const [otherMode, setOtherMode] = useState({});

         const handleChange = (idx, value) => {
            const newValues = [...formData];
            newValues[idx] = value;
            setFormData(newValues);
         }

         // שליפת אופציות קיימות מהשיטס בלבד
         const getExistingOptions = (colIdx) => {
            return [...new Set(fullData.map(item => item.values[colIdx]).filter(v => v && v.trim() !== "" && v !== "בקשת מידע"))].sort();
         }

         return (
            <div className="bg-white rounded-2xl w-full max-w-lg flex flex-col max-h-[90vh] fade-in shadow-2xl" onClick={e=>e.stopPropagation()}>
               <div className="p-5 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                  <h2 className="font-bold text-xl">{title}</h2>
                  <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="X" size={20}/></button>
               </div>
               <div className="p-6 overflow-y-auto bg-white text-right">
                  <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
                     {COLUMNS.map((col) => {
                        if (col.auto) return null;
                        const existingOpts = getExistingOptions(col.idx);
                        const isSelect = col.type === 'select' || col.smart;

                        return (
                           <div key={col.idx} className="form-group">
                              <label className="field-label">{col.label}</label>
                              {col.type === 'textarea' ? (
                                 <textarea className="solid-input min-h-[80px]" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} />
                              ) : isSelect && !otherMode[col.idx] ? (
                                 <div className="relative">
                                     <select className="solid-input appearance-none" value={formData[col.idx] || ''} 
                                       onChange={e => e.target.value === "OTHER_VAL" ? (setOtherMode({...otherMode, [col.idx]: true}), handleChange(col.idx, "")) : handleChange(col.idx, e.target.value)} 
                                       required={col.required}>
                                        <option value="" disabled>בחר מהרשימה...</option>
                                        {existingOpts.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        <option value="OTHER_VAL" className="text-indigo-600 font-bold italic">+ אחר (הוספה ידנית)...</option>
                                     </select>
                                     <div className="absolute left-3 top-[38px] pointer-events-none text-slate-400"><Icon name="ChevronDown" size={16} /></div>
                                 </div>
                              ) : (
                                 <div className="relative">
                                    <input type={col.type==='email'?'email':'text'} className="solid-input" placeholder={otherMode[col.idx] ? "הקלד ערך חדש..." : ""} value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} required={col.required} />
                                    {otherMode[col.idx] && <button type="button" onClick={() => setOtherMode({...otherMode, [col.idx]: false})} className="absolute left-2 top-[36px] bg-slate-100 text-slate-500 px-2 py-1 rounded text-[10px] border">חזור</button>}
                                 </div>
                              )}
                           </div>
                        )
                     })}
                     <button disabled={isSubmitting} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-4 flex justify-center gap-2">
                        {isSubmitting ? <Icon name="Loader2" className="spin" /> : submitText}
                     </button>
                  </form>
               </div>
            </div>
         );
      }

      // ==========================================
      // בלוק 5: צפייה, עריכה, בקשות
      // ==========================================
      const ViewEditModal = ({ item, onClose, onRefresh, setToast, userEmail, fullData }) => {
         const [mode, setMode] = useState('view');
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [comment, setComment] = useState("");
         const [editData, setEditData] = useState([...item.values]); 
         const isRequest = item.values[0] === "בקשת מידע";
         const canEdit = userEmail === MANAGER_EMAIL || userEmail === item.values[3];
         let commentsList = []; try { commentsList = item.comments ? JSON.parse(item.comments) : []; } catch (e) { commentsList = []; }
         const followers = item.interestedUsers ? item.interestedUsers.split(",").filter(Boolean) : [];
         const isFollowing = followers.includes(userEmail);

         const handleUpdate = async (isConvert = false) => {
            setIsSubmitting(true);
            const newDataArray = [...editData];
            newDataArray[15] = new Date().toLocaleDateString('he-IL');
            if(isConvert) { newDataArray[0] = ""; newDataArray[3] = userEmail; }
            try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', id: item.id, values: newDataArray, status: isConvert ? 'Closed' : item.status }) }); setToast("עודכן!"); onRefresh(); onClose(); } catch(e) { setIsSubmitting(false); }
         }

         const handleComment = async () => {
            if(!comment) return;
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'addComment', id: item.id, userEmail, text: comment }) });
            setToast("תגובה נוספה"); onRefresh(); onClose();
         }

         const handleFollow = async () => {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'toggleFollow', id: item.id, userEmail }) });
            setToast(isFollowing ? "הוסר מעקב" : "במעקב"); onRefresh(); onClose();
         }

         if (mode === 'edit') return <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 fade-in" onClick={onClose}><DynamicForm title={isRequest ? "הפיכה למקור" : "עריכה"} formData={editData} setFormData={setEditData} fullData={fullData} onSubmit={()=>handleUpdate(isRequest)} isSubmitting={isSubmitting} onClose={onClose} submitText="שמור שינויים" /></div>;

         return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in text-right" onClick={onClose}>
               <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col" onClick={e=>e.stopPropagation()}>
                  <div className={`p-6 border-b flex justify-between items-start sticky top-0 bg-white z-10 ${isRequest?'bg-orange-50':''}`}>
                     <div className="flex gap-2">
                        {canEdit && <button onClick={()=>setMode('edit')} className="p-2 border rounded-full hover:bg-slate-50" title="ערוך"><Icon name="Edit3" size={18}/></button>}
                        {isRequest && <button onClick={handleFollow} className={`px-4 py-2 rounded-xl font-bold text-sm border transition ${isFollowing?'bg-indigo-100 text-indigo-700 border-indigo-200':'bg-white text-slate-600'}`}>{isFollowing?'במעקב':'עקוב'}</button>}
                        <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="X" size={24}/></button>
                     </div>
                     <div><span className="text-xs font-bold px-2 py-1 rounded bg-slate-100 border">{item.values[0]}</span><h2 className="text-2xl font-bold text-slate-900 mt-2">{item.values[1]}</h2></div>
                  </div>
                  <div className="p-8 space-y-6">
                     <div className="grid grid-cols-1 gap-4">
                        {COLUMNS.map((col) => {
                           const val = item.values[col.idx]; if (!val) return null;
                           return <div key={col.idx} className="bg-slate-50 p-4 rounded-xl border"><div className="text-xs font-bold text-slate-400 uppercase mb-1">{col.label}</div><div className="font-medium text-slate-900"><Linkify content={val} /></div></div>;
                        })}
                     </div>
                     {isRequest && (
                        <div className="bg-indigo-600 text-white p-6 rounded-xl flex justify-between items-center shadow-lg">
                           <button onClick={()=>{ if (!canEdit) { alert("רק מי שפתח את הבקשה יכול לעדכן אותה"); return; } setMode('edit'); }} className="bg-white text-indigo-600 px-6 py-3 rounded-xl font-bold">עדכן למקור</button>
                           <div className="text-left">השגת את הנתונים? הפוך את הבקשה למקור רשמי</div>
                        </div>
                     )}
                     <div className="border-t pt-6">
                        <h3 className="font-bold mb-4 text-slate-500 text-sm uppercase">תגובות ({commentsList.length})</h3>
                        <div className="space-y-4 mb-4 max-h-40 overflow-y-auto pr-2 custom-scrollbar">
                           {commentsList.map((c,i)=><div key={i} className="flex gap-3"><div className="bg-slate-50 p-3 rounded-2xl border flex-1"><span className="font-bold block text-xs text-slate-400 mb-1">{c.user.split('@')[0]}</span><p className="text-sm">{c.text}</p></div></div>)}
                        </div>
                        <div className="flex gap-2 relative"><input className="solid-input pl-12" placeholder="הוסף תגובה..." value={comment} onChange={e=>setComment(e.target.value)} /><button onClick={handleComment} className="absolute left-2 top-[18px] p-2 bg-slate-900 text-white rounded-lg"><Icon name="Send" size={14}/></button></div>
                     </div>
                  </div>
               </div>
            </div>
         );
      }

      const RequestWizard = ({ onClose, onRefresh, setToast, userEmail }) => {
         const [step, setStep] = useState(1);
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [reqData, setReqData] = useState({ desc: '', topic: '', name: '', email: userEmail || '' });

         const handleSubmit = async (e) => {
            e.preventDefault(); setIsSubmitting(true);
            const values = Array(16).fill(""); values[0] = "בקשת מידע"; values[1] = reqData.desc; values[2] = reqData.name; values[3] = reqData.email; values[5] = reqData.topic; values[15] = new Date().toLocaleDateString('he-IL'); 
            try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'create', values }) }); setToast("נפתח בהצלחה!"); onRefresh(); onClose(); } catch(e) { setIsSubmitting(false); }
         };

         return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in" onClick={onClose}>
               <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col" onClick={e=>e.stopPropagation()}>
                  <div className="bg-slate-900 p-8 text-white text-center relative"><h2 className="text-2xl font-bold">{step===1?'בדיקת קטלוג':step===2?'בדיקת רשת':'פתיחת בקשה'}</h2><button onClick={onClose} className="absolute top-4 left-4 p-2 hover:bg-white/20 rounded-full"><Icon name="X" size={20}/></button></div>
                  <div className="p-8 text-center space-y-6">
                     {step===1 && <div className="space-y-6"><Icon name="Library" size={60} className="text-indigo-600 mx-auto"/><h3 className="text-xl font-bold">האם ווידאת שהנתונים לא נמצאים בקטלוג?</h3><div className="flex gap-3"><button onClick={onClose} className="flex-1 py-4 border-2 rounded-xl font-bold">בודק שוב</button><button onClick={()=>setStep(2)} className="flex-1 py-4 bg-indigo-600 text-white rounded-xl font-bold">בדקתי, אין</button></div></div>}
                     {step===2 && <div className="space-y-6"><Icon name="Globe" size={60} className="text-cyan-600 mx-auto"/><h3 className="text-xl font-bold">האם בדקת במקורות פומביים באינטרנט?</h3><div className="flex gap-3"><button onClick={()=>setStep(1)} className="px-6 py-4 font-bold text-slate-400">חזור</button><button onClick={()=>setStep(3)} className="flex-1 py-4 bg-cyan-600 text-white rounded-xl font-bold">חיפשתי, אין</button></div></div>}
                     {step===3 && <form onSubmit={handleSubmit} className="text-right space-y-4">
                        <div className="form-group"><label className="field-label">נושא הבקשה</label><input required className="solid-input" placeholder="לדוגמא: נתוני בריאות" value={reqData.topic} onChange={e=>setReqData({...reqData, topic:e.target.value})} /></div>
                        <div className="form-group"><label className="field-label">תיאור הנתונים</label><input required className="solid-input" placeholder="פירוט..." value={reqData.desc} onChange={e=>setReqData({...reqData, desc:e.target.value})} /></div>
                        <div className="grid grid-cols-2 gap-4">
                           <div className="form-group"><label className="field-label">שם</label><input required className="solid-input" value={reqData.name} onChange={e=>setReqData({...reqData, name:e.target.value})} /></div>
                           <div className="form-group"><label className="field-label">מייל</label><input type="email" required className="solid-input" value={reqData.email} onChange={e=>setReqData({...reqData, email:e.target.value})} /></div>
                        </div>
                        <button disabled={isSubmitting} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-4 flex justify-center gap-2">{isSubmitting?<Icon name="Loader2" className="spin"/>:'פתח בקשה'}</button>
                     </form>}
                  </div>
               </div>
            </div>
         );
      };

      const AddDataWrapper = ({ onClose, onRefresh, fullData, setToast, userEmail }) => {
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [formData, setFormData] = useState(Array(16).fill(""));
         const handleSubmit = async () => { setIsSubmitting(true); const newData = [...formData]; newData[15] = new Date().toLocaleDateString('he-IL'); if(!newData[3]) newData[3] = userEmail; try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'create', values: newData }) }); setToast("נוסף!"); onRefresh(); onClose(); } catch(e) { setIsSubmitting(false); } };
         return <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 fade-in" onClick={onClose}><DynamicForm title="הוספת מקור נתונים" formData={formData} setFormData={setFormData} fullData={fullData} onSubmit={handleSubmit} isSubmitting={isSubmitting} onClose={onClose} submitText="שמור למאגר" /></div>;
      };

      // ==========================================
      // בלוק 6: האפליקציה הראשית (ניהול State ופילטור)
      // ==========================================
      function App() {
        const [data, setData] = useState([]);
        const [searchTerm, setSearchTerm] = useState("");
        const [selectedDomain, setSelectedDomain] = useState(null);
        const [isLoading, setIsLoading] = useState(true);
        const [selectedItem, setSelectedItem] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [showRequestModal, setShowRequestModal] = useState(false);
        const [showNotifications, setShowNotifications] = useState(false);
        const [toastMsg, setToastMsg] = useState(null);
        const [userEmail, setUserEmail] = useState("");

        useEffect(() => { const storedEmail = localStorage.getItem('userEmail'); if (storedEmail) setUserEmail(storedEmail); fetchData(); }, []);
        
        const fetchData = async () => { setIsLoading(true); try { const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(GOOGLE_CSV_URL + `&t=${Date.now()}`)}`); const text = await response.text(); const rows = parseCSV(text); if (rows.length < 2) { setData([]); return; } const newData = rows.slice(1).map((row, index) => ({ id: index, values: row.slice(0, 16), interestedUsers: row[16], comments: row[17], status: row[18] })).filter(i => i.values[1]); setData(newData); } catch (err) {} finally { setIsLoading(false); } };

        const filteredData = useMemo(() => data.filter(item => item.values.join(" ").toLowerCase().includes(searchTerm.toLowerCase()) && (selectedDomain ? item.values[0] === selectedDomain : true)), [data, searchTerm, selectedDomain]);
        const domains = [...new Set(data.map(i => i.values[0]).filter(d => d && d !== "בקשת מידע"))].filter(Boolean);
        const notifications = useMemo(() => getNotifications(data, userEmail), [data, userEmail]);

        if (!userEmail) return <LoginPage onLogin={(email) => { localStorage.setItem('userEmail', email); setUserEmail(email); }} isChecking={false} />;

        return (
          <div className="min-h-screen pb-20 fade-in text-right">
             <header className="bg-white/80 backdrop-blur-xl sticky top-0 z-30 border-b p-4 flex justify-between items-center gap-4">
                <div className="flex gap-2 items-center">
                   <button onClick={() => setShowRequestModal(true)} className="bg-white text-indigo-700 px-4 py-2 rounded-xl font-bold text-sm border border-indigo-100 hover:bg-indigo-50">בקשה למקור</button>
                   <button onClick={() => setShowAddModal(true)} className="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-lg">הוספת מקור</button>
                   <button onClick={() => setShowNotifications(true)} className="bg-white border px-3 py-2 rounded-xl relative"><Icon name="Bell" size={18} />{notifications.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}</button>
                   <button onClick={fetchData} className="bg-white border px-3 py-2 rounded-xl"><Icon name="RefreshCw" className={isLoading?"spin":""}/></button>
                </div>
                <div className="font-bold text-xl flex items-center gap-2 cursor-pointer" onClick={()=>{setSelectedDomain(null);}}>
                   <span>Analyst Data Hub</span>
                   <div className="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-200"><Icon name="Database" size={20} /></div> 
                </div>
             </header>

             <div className="max-w-7xl mx-auto px-4 mt-8">
                <div className="mb-8 relative"><input placeholder="חיפוש חופשי בכל המאגר..." className="solid-input pr-12" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} /><Icon name="Search" className="absolute right-4 top-[18px] text-slate-400" /></div>
                <div className="flex flex-wrap gap-2 mb-8 justify-end">
                   {domains.map(d=><button key={d} onClick={() => setSelectedDomain(d)} className={`px-4 py-2 rounded-xl font-bold text-sm ${selectedDomain===d?'bg-slate-800 text-white shadow-lg scale-105':'bg-white border text-slate-600 hover:bg-slate-50'}`}>{d}</button>)}
                   <button onClick={() => setSelectedDomain("בקשת מידע")} className={`px-4 py-2 rounded-xl font-bold text-sm ${selectedDomain==="בקשת מידע"?'bg-orange-500 text-white shadow-lg scale-105':'bg-white border text-orange-600 border-orange-200 hover:bg-orange-50'}`}>בקשות</button>
                   <button onClick={() => setSelectedDomain(null)} className={`px-4 py-2 rounded-xl font-bold text-sm ${!selectedDomain?'bg-slate-800 text-white shadow-lg scale-105':'bg-white border text-slate-600 hover:bg-slate-50'}`}>הכל</button>
                </div>

                {isLoading && data.length === 0 ? <div className="text-center py-20 opacity-50">טוען נתונים...</div> : 
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">{filteredData.map((item, idx) => (<Card key={idx} item={item} index={idx} onClick={() => setSelectedItem(item)} userEmail={userEmail} />))}</div>
                }
             </div>

             {selectedItem && <ViewEditModal item={selectedItem} onClose={()=>setSelectedItem(null)} onRefresh={fetchData} setToast={setToastMsg} userEmail={userEmail} fullData={data} />}
             {showAddModal && <AddDataWrapper onClose={()=>setShowAddModal(false)} onRefresh={fetchData} fullData={data} setToast={setToastMsg} userEmail={userEmail} />}
             {showRequestModal && <RequestWizard onClose={()=>setShowRequestModal(false)} onRefresh={fetchData} setToast={setToastMsg} userEmail={userEmail} />}
             {showNotifications && <NotificationsModal onClose={()=>setShowNotifications(false)} notifications={notifications} />}
             {toastMsg && <Toast message={toastMsg} onClose={()=>setToastMsg(null)} />}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<React.StrictMode><App /></React.StrictMode>);
    </script>
  </body>
</html>
