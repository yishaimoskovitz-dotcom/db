<!DOCTYPE html>
<html dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג מידע וידע</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; color: #0f172a; direction: rtl; margin: 0; }
      .bg-gradient-fixed {
        background: radial-gradient(circle at 10% 20%, rgb(241, 245, 249) 0%, rgb(255, 255, 255) 90%);
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
      }
      .solid-input {
        display: block; width: 100%; background-color: #ffffff;
        border: 2px solid #000000 !important; border-radius: 12px;
        padding: 12px 16px; font-size: 16px; color: #000000;
        outline: none; transition: all 0.2s; margin-top: 6px; box-sizing: border-box;
      }
      .solid-input:focus { border-color: #4f46e5 !important; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
      .field-label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; }
      .form-group { margin-bottom: 20px; width: 100%; }

      .modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(8px); z-index: 1000;
        display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      .modal-content {
        background: white; border-radius: 28px; width: 100%; max-width: 650px;
        max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      .modal-header { padding: 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; background: white; flex-shrink: 0; }
      .modal-body { overflow-y: auto; padding: 32px; flex-grow: 1; }
      
      .spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 14px 28px; border-radius: 16px; z-index: 3000; display: flex; align-items: center; gap: 12px; }

      .comment-badge-enhanced {
        background-color: #f0f7ff;
        color: #1d4ed8;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #bfdbfe;
        transition: all 0.2s;
      }
      .group:hover .comment-badge-enhanced {
        background-color: #2563eb;
        color: white;
        border-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="bg-gradient-fixed"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      const SHEET_ID = '1myMr9MeMtgAcipoR1rJaX3MdamlIBZugt_TX5eafX7Q';
      const GOOGLE_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKQAK0yZ5-m9pYMJYTn9cbUKHMu-YGvvw7pcTHEUqd0rSAWHTkWElZSfqAb2hdbPEw/exec"; 
      const MANAGER_EMAIL = "yishaimoskovitz@gmail.com";

      const COLUMNS = [
        { idx: 0, label: 'נושא', type: 'select', required: true },
        { idx: 1, label: 'תת נושא', type: 'text', required: true },
        { idx: 2, label: 'אחראי', type: 'select' },
        { idx: 3, label: 'אימייל אחראי', type: 'select' }, 
        { idx: 4, label: 'תיאור מקור', type: 'textarea' },
        { idx: 5, label: 'שם המקור', type: 'select' },
        { idx: 10, label: 'אופן העברה', type: 'select' },
        { idx: 11, label: 'רגישות נתונים', type: 'select' },
        { idx: 12, label: 'תדירות העברה', type: 'select' },
        { idx: 13, label: 'סוג המקור', type: 'select' },
        { idx: 14, label: 'איכות המקור', type: 'select' },
        { idx: 15, label: 'עדכון אחרון', type: 'date', auto: true }
      ];

      const parseCSV = (str) => {
        const arr = [];
        let quote = false, col = 0, row = 0, c = 0;
        for (; c < str.length; c++) {
          let cc = str[c], nc = str[c+1];
          arr[row] = arr[row] || [];
          arr[row][col] = arr[row][col] || '';
          if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
          if (cc == '"') { quote = !quote; continue; }
          if (cc == ',' && !quote) { ++col; continue; }
          if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
          if (cc == '\n' && !quote) { ++row; col = 0; continue; }
          arr[row][col] += cc;
        }
        return arr;
      };

      const Icon = ({ name, size = 16, className = "" }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (window.lucide && ref.current) {
            ref.current.innerHTML = '';
            const i = document.createElement('i');
            i.setAttribute('data-lucide', name);
            i.style.width = `${size}px`; i.style.height = `${size}px`; i.className = className;
            ref.current.appendChild(i);
            try { window.lucide.createIcons({ root: ref.current, icons: { [name]: window.lucide.icons[name] } }); } catch(e) {}
          }
        }, [name, size, className]);
        return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{width: size, height: size}}></span>;
      };

      const Linkify = ({ content }) => {
        if (typeof content !== 'string') return content;
        const parts = content.split(/((?:https?:\/\/|www\.)[^\s]+)/g);
        return <>{parts.map((p, i) => p.match(/^(https?:\/\/|www\.)/) ? <a key={i} href={p.startsWith('www') ? `https://${p}` : p} target="_blank" className="text-indigo-600 hover:underline font-medium break-all" onClick={e=>e.stopPropagation()}>{p}</a> : p)}</>;
      };

      const DynamicForm = ({ title, formData, setFormData, onSubmit, onClose, submitText, isSubmitting, fullData }) => {
         const [otherMode, setOtherMode] = useState({});
         const handleChange = (idx, value) => {
            const newValues = [...formData];
            newValues[idx] = value;
            setFormData(newValues);
         }
         const getOptions = (colIdx) => {
            return [...new Set(fullData.map(item => item.values[colIdx]).filter(v => v && v.trim() !== ""))].sort();
         }

         return (
            <div className="modal-content" onClick={e=>e.stopPropagation()}>
               <div className="modal-header">
                  <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icon name="X" size={24}/></button>
                  <h2 className="font-bold text-2xl">{title}</h2>
               </div>
               <div className="modal-body text-right">
                  <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
                     {COLUMNS.map((col) => {
                        if (col.auto) return null;
                        const opts = getOptions(col.idx);
                        const isSelect = col.type === 'select' || (opts.length > 0 && col.idx !== 1);
                        return (
                           <div key={col.idx} className="form-group">
                              <label className="field-label">{col.label}</label>
                              {col.type === 'textarea' ? (
                                 <textarea className="solid-input min-h-[120px]" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} />
                              ) : isSelect && !otherMode[col.idx] ? (
                                 <div className="relative">
                                     <select className="solid-input appearance-none cursor-pointer" value={formData[col.idx] || ''} 
                                       onChange={e => e.target.value === "NEW" ? (setOtherMode({...otherMode, [col.idx]: true}), handleChange(col.idx, "")) : handleChange(col.idx, e.target.value)} 
                                       required={col.required}>
                                        <option value="" disabled>בחר מהקיים...</option>
                                        {opts.map(o => <option key={o} value={o}>{o}</option>)}
                                        <option value="NEW" className="text-indigo-600 font-bold italic">+ אחר (הקלדה חופשית)...</option>
                                     </select>
                                     <div className="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 mt-1"><Icon name="ChevronDown" size={18} /></div>
                                 </div>
                              ) : (
                                 <div className="relative">
                                    <input type={col.idx===3?'email':'text'} className="solid-input" value={formData[col.idx] || ''} onChange={e => handleChange(col.idx, e.target.value)} required={col.required} placeholder={otherMode[col.idx] ? "הקלד ערך חדש..." : ""} />
                                    {otherMode[col.idx] && <button type="button" onClick={() => setOtherMode({...otherMode, [col.idx]: false})} className="absolute left-2 top-[23px] bg-slate-100 text-slate-500 px-2 py-1 rounded text-[10px] border">חזור</button>}
                                 </div>
                              )}
                           </div>
                        )
                     })}
                     <button disabled={isSubmitting} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mt-6 shadow-lg hover:bg-indigo-700 transition-all flex justify-center gap-2 text-lg">
                        {isSubmitting ? <Icon name="Loader2" className="spin" /> : submitText}
                     </button>
                  </form>
               </div>
            </div>
         );
      }

      const ViewEditModal = ({ item, onClose, onRefresh, setToast, userEmail, fullData }) => {
         const [mode, setMode] = useState('view');
         const [isSubmitting, setIsSubmitting] = useState(false);
         const [comment, setComment] = useState("");
         const [editData, setEditData] = useState([...item.values]); 
         const canEdit = userEmail === MANAGER_EMAIL || userEmail === item.values[3];

         let commentsList = [];
         try { commentsList = item.comments ? JSON.parse(item.comments) : []; } catch (e) { commentsList = []; }

         const handleUpdate = async () => {
            setIsSubmitting(true);
            const newDataArray = [...editData];
            newDataArray[15] = new Date().toLocaleDateString('he-IL');
            try { 
               await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'update', id: item.id, values: newDataArray }) }); 
               setToast("עודכן בהצלחה!"); 
               setTimeout(() => { onRefresh(); onClose(); }, 1000);
            } catch(e) { setIsSubmitting(false); }
         }

         const handlePostComment = async () => {
            if (!comment.trim()) return;
            setIsSubmitting(true);
            try {
               await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'addComment', id: item.id, userEmail, text: comment }) });
               setToast("הערה נשלחה!"); 
               setTimeout(() => { onRefresh(); onClose(); }, 1000);
            } catch(e) { setIsSubmitting(false); }
         }

         const handleKeyPress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
               e.preventDefault();
               handlePostComment();
            }
         };

         if (mode === 'edit') return <div className="modal-overlay" onClick={onClose}><DynamicForm title="עריכת פרטים" formData={editData} setFormData={setEditData} fullData={fullData} onSubmit={handleUpdate} isSubmitting={isSubmitting} onClose={onClose} submitText="שמור שינויים" /></div>;

         return (
            <div className="modal-overlay" onClick={onClose}>
               <div className="modal-content" onClick={e=>e.stopPropagation()}>
                  <div className="modal-header">
                     <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icon name="X" size={28}/></button>
                     <h2 className="text-xl font-bold">{item.values[1]}</h2>
                  </div>
                  <div className="modal-body text-right">
                     <div className="space-y-5">
                        {COLUMNS.map((col) => {
                           const val = item.values[col.idx]; if (!val) return null;
                           return (
                             <div key={col.idx} className="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                               <div className="text-[11px] font-bold text-slate-400 uppercase mb-2 tracking-wider">{col.label}</div>
                               <div className="font-medium text-slate-900 text-lg"><Linkify content={val} /></div>
                             </div>
                           );
                        })}
                     </div>
                     
                     {canEdit && <button onClick={()=>setMode('edit')} className="w-full py-4 border-2 border-indigo-600 text-indigo-600 rounded-xl font-bold mt-8 hover:bg-indigo-50 transition-all flex items-center justify-center gap-2 text-lg"><Icon name="Edit3" size={20}/> ערוך פרטים</button>}

                     <div className="mt-12 pt-8 border-t border-slate-100">
                        <h3 className="font-bold text-slate-500 mb-6 flex items-center gap-2 text-lg"><Icon name="MessageSquare" size={20}/> הערות ({commentsList.length})</h3>
                        <div className="space-y-4 mb-6">
                           {commentsList.map((c, i) => (
                              <div key={i} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                 <div className="text-[11px] text-slate-400 font-bold mb-2">{c.user.split('@')[0]} • {new Date(c.date).toLocaleDateString('he-IL')}</div>
                                 <div className="text-slate-700 leading-relaxed">{c.text}</div>
                              </div>
                           ))}
                        </div>
                        <div className="flex gap-3 relative">
                           <input 
                              className="solid-input pr-12 h-14" 
                              placeholder="כתוב הערה (Enter לשליחה)..." 
                              value={comment} 
                              onChange={e=>setComment(e.target.value)}
                              onKeyDown={handleKeyPress}
                           />
                           <button onClick={handlePostComment} disabled={isSubmitting} className="absolute left-2 top-1/2 -translate-y-1/2 p-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all w-10 h-10 flex items-center justify-center">
                              {isSubmitting ? <Icon name="Loader2" className="spin" size={18} /> : <Icon name="Send" size={18}/>}
                           </button>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         );
      }

      function App() {
        const [data, setData] = useState([]);
        const [searchTerm, setSearchTerm] = useState("");
        const [selectedDomain, setSelectedDomain] = useState(null);
        const [isLoading, setIsLoading] = useState(true);
        const [selectedItem, setSelectedItem] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [toastMsg, setToastMsg] = useState(null);
        const [userEmail, setUserEmail] = useState("");

        useEffect(() => { const stored = localStorage.getItem('userEmail'); if (stored) setUserEmail(stored); fetchData(); }, []);
        
        const fetchData = async () => { 
          setIsLoading(true); 
          try { 
            const resp = await fetch(`https://corsproxy.io/?${encodeURIComponent(GOOGLE_CSV_URL + `&t=${Date.now()}`)}`); 
            const text = await resp.text(); 
            const rows = parseCSV(text); 
            if (rows.length < 2) { setData([]); return; } 
            const newData = rows.slice(1).map((row, index) => ({ 
               id: index, values: row.slice(0, 16), interestedUsers: row[16], comments: row[17]
            })).filter(i => i.values[1]); 
            setData(newData); 
          } catch (err) {} finally { setIsLoading(false); } 
        };

        // לוגיקה לבדיקת הרשאת הוספה: האם המשתמש הוא מנהל או שהוא מופיע כבר כאחראי על אחד הבלוקים
        const canAddSource = useMemo(() => {
           if (!userEmail) return false;
           if (userEmail === MANAGER_EMAIL) return true;
           return data.some(item => item.values[3] && item.values[3].toLowerCase() === userEmail.toLowerCase());
        }, [data, userEmail]);

        const filteredData = useMemo(() => data.filter(item => item.values.join(" ").toLowerCase().includes(searchTerm.toLowerCase()) && (selectedDomain ? item.values[0] === selectedDomain : true)), [data, searchTerm, selectedDomain]);
        const domains = [...new Set(data.map(i => i.values[0]))].filter(Boolean);

        if (!userEmail) return (
           <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-white p-10 rounded-[32px] shadow-2xl w-full max-w-md text-center border border-slate-100 fade-in">
                 <div className="bg-indigo-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-xl shadow-indigo-200"><Icon name="Database" size={40} className="text-white" /></div>
                 <h1 className="text-3xl font-bold mb-8 text-slate-900">קטלוג מידע וידע</h1>
                 <form onSubmit={(e) => { e.preventDefault(); const em = e.target.email.value; if(em.includes('@')) { localStorage.setItem('userEmail', em); setUserEmail(em); } }}>
                    <div className="form-group text-right"><label className="field-label">מייל ארגוני</label><input name="email" type="email" className="solid-input h-14" placeholder="your@email.com" required autoFocus /></div>
                    <button className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg text-lg">כניסה למערכת</button>
                 </form>
              </div>
           </div>
        );

        return (
          <div className="min-h-screen pb-20 fade-in text-right">
             <header className="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b p-5 flex justify-between items-center shadow-sm">
                <div className="flex gap-4 items-center">
                   {/* כפתור הוספה מוצג רק למורשים */}
                   {canAddSource && (
                      <button onClick={() => setShowAddModal(true)} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-2">
                        <Icon name="Plus" size={18}/> הוספת מקור
                      </button>
                   )}
                   <button onClick={fetchData} className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-2">
                      <Icon name="RefreshCw" className={isLoading?"spin":""} size={18}/> רענן נתונים
                   </button>
                </div>
                <div className="font-bold text-2xl flex items-center gap-3 cursor-pointer" onClick={()=>{setSelectedDomain(null); setSearchTerm("");}}>
                   <span className="text-slate-900">קטלוג מידע וידע</span>
                   <div className="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-lg shadow-indigo-100"><Icon name="Database" size={24} /></div> 
                </div>
             </header>

             <div className="max-w-7xl mx-auto px-4 mt-12 text-center">
                <div className="mb-12 relative max-w-2xl mx-auto">
                  <input placeholder="חיפוש חופשי בקטלוג..." className="solid-input pr-14 h-16 text-xl shadow-xl shadow-slate-100 border-none" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
                  <div className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex items-center h-full">
                      <Icon name="Search" size={26} />
                  </div>
                </div>
                
                <div className="flex flex-wrap gap-3 mb-12 justify-center">
                   {domains.map(d=><button key={d} onClick={() => setSelectedDomain(d)} className={`px-6 py-3 rounded-2xl font-bold text-sm transition-all ${selectedDomain===d?'bg-slate-900 text-white shadow-xl scale-105':'bg-white border-2 border-slate-100 text-slate-500 hover:border-indigo-200'}`}>{d}</button>)}
                   <button onClick={() => setSelectedDomain(null)} className={`px-6 py-3 rounded-2xl font-bold text-sm transition-all ${!selectedDomain?'bg-slate-900 text-white shadow-xl scale-105':'bg-white border-2 border-slate-100 text-slate-500 hover:border-indigo-200'}`}>הכל</button>
                </div>

                {isLoading && data.length === 0 ? <div className="text-center py-20 opacity-50 flex flex-col items-center gap-4"><Icon name="Loader2" className="spin text-indigo-600" size={56} /><p className="text-lg">מתחבר למסד הנתונים...</p></div> : 
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                    {filteredData.map((item, idx) => {
                       let count = 0;
                       try { count = item.comments ? JSON.parse(item.comments).length : 0; } catch(e) {}
                       
                       return (
                       <div key={idx} onClick={() => setSelectedItem(item)} className="bg-white rounded-[32px] border border-slate-100 p-8 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all cursor-pointer text-right flex flex-col relative overflow-hidden group">
                          <div className="h-2 w-full bg-indigo-500 absolute top-0 left-0 group-hover:bg-indigo-600 transition-colors"></div>
                          <span className="text-[11px] font-bold text-indigo-500 uppercase mb-3 tracking-widest">{item.values[0]}</span>
                          <h3 className="text-xl font-bold text-slate-900 leading-snug mb-6 flex-grow">{item.values[1]}</h3>
                          <div className="flex justify-between items-center border-t border-slate-50 pt-5 mt-auto">
                             <div className="text-sm text-slate-400 flex items-center gap-2 font-medium">
                                <Icon name="User" size={16} className="text-slate-300"/> {item.values[2] || "לא צוין"}
                             </div>
                             {count > 0 && (
                                <div className="comment-badge-enhanced">
                                   <Icon name="MessageSquare" size={14} />
                                   <span>{count} {count === 1 ? 'הערה' : 'הערות'}</span>
                                </div>
                             )}
                          </div>
                       </div>
                    )})}
                  </div>
                }
             </div>

             {selectedItem && <ViewEditModal item={selectedItem} onClose={()=>setSelectedItem(null)} onRefresh={fetchData} setToast={setToastMsg} userEmail={userEmail} fullData={data} />}
             
             {showAddModal && canAddSource && (
               <div className="modal-overlay" onClick={()=>setShowAddModal(false)}>
                  <DynamicForm title="הוספת מקור חדש" formData={Array(16).fill("")} setFormData={(vals) => {
                      const add = async () => {
                         try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'create', values: vals.map((v,i)=>i===15?new Date().toLocaleDateString('he-IL'):(i===3 && !v ? userEmail : v)) }) }); setToastMsg("מקור נתונים נוסף בהצלחה!"); fetchData(); setShowAddModal(false); } catch(e) {}
                      }; add();
                    }} fullData={data} onSubmit={()=>{}} isSubmitting={false} onClose={()=>setShowAddModal(false)} submitText="שמור למאגר" />
               </div>
             )}
             {toastMsg && <div className="toast fade-in" onClick={()=>setToastMsg(null)}><Icon name="CheckCircle" size={20} className="text-emerald-400" /> {toastMsg}</div>}
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
